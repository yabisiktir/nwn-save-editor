[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwn-save-editor"
version = "0.1.0"
description = "Read and edit Neverwinter Nights save games, and the file formats behind them."
readme = "README.md"
requires-python = ">=3.11,<3.14"  # PySide6 wheels not yet published for 3.14; dev on 3.12/3.13
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "aqzina" }]
keywords = ["neverwinter-nights", "nwn", "save-game", "gff", "erf", "pyside6"]

dependencies = [
    "PySide6>=6.7,<6.9",   # Qt for Python (LGPL). The editor's GUI.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyyaml>=6.0",   # test_ci_workflow.py parses the workflow
    # Pinned, not floated: CI installs the newest match, and a ruff release
    # that changes a rule turns a green repository red with no commit behind
    # it — which is exactly how "clean locally, I001 in CI" happened. Bump
    # this deliberately, with the fixes in the same commit.
    "ruff==0.16.1",
    "mypy>=1.11",
]

[project.gui-scripts]
nwn-save-editor = "nwnsaveeditor.ui.editor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nwnfile", "src/nwnsaveeditor"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Both packages here are ours. Stated rather than inferred, because ruff versions
# disagreed about how to classify them when Vaultkeeper imports them from a
# sibling checkout — the same file came out clean under one and I001 under
# another, each wanting the opposite fix.
known-first-party = ["nwnfile", "nwnsaveeditor", "tests"]

[tool.ruff.lint.per-file-ignores]
# Salvaged binary-format readers, kept close to their working original pending a
# typed refactor. Their "unused" locals (F841) are deliberate offset-advancing
# reads (e.g. `x = self._read_dword()`) that must NOT be removed; a few long
# lines/loop vars are tolerated here until the refactor.
"src/nwnfile/formats/*" = ["F841", "E501", "B007", "SIM"]
"tests/test_erf_reader.py" = ["E501", "F841"]
"tests/test_gff_reader.py" = ["E501", "F841"]
"tests/test_tga_reader.py" = ["E501", "F841"]
"tests/test_bic_reader.py" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." as well as "src": several test modules share fixtures via
# `from tests.test_save_editor import ...`, which needs the repo root importable.
# `python -m pytest` puts the working directory on sys.path and the `pytest`
# console script does not — so without this the suite passes one way and dies
# collecting the other, which is exactly how it reached CI green-looking.
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit test",
    "integration: exercises real files/multiple components",
]

[tool.mypy]
python_version = "3.11"
packages = ["nwnfile", "nwnsaveeditor"]
mypy_path = "src"
strict = true
warn_unused_ignores = true

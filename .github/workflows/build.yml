name: Build

# Artifacts are produced on the OS they target: a PySide6 freeze embeds a Python
# interpreter and Qt's native libraries, so there is no cross-building. That
# extends to CPU: PySide6 ships per-architecture wheels.
#
# macOS is Apple Silicon only. An arm64 freeze will not launch on an Intel Mac,
# so an x86_64 artifact would have to be built separately, and nobody is asking
# for one. Restore a `macos-13` entry below if that changes.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Qt needs an X server and a pile of system libraries to open a window.
      # xvfb gives it one; the offscreen platform alone is not enough for every
      # widget path.
      - name: Install Qt's system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 xvfb

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Lint
        run: ruff check src tests scripts

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            label: macOS (arm64)
          - os: windows-latest
            label: Windows (x64)
          - os: ubuntu-latest
            label: Linux (x86_64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt's system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2

      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller

      - name: Build
        run: python scripts/build_app.py --clean

      # A freeze that produces a binary which cannot start is the failure mode
      # worth catching here, and --help exercises import of the whole app.
      - name: Smoke test the frozen app (macOS)
        if: runner.os == 'macOS'
        run: "'dist/NWN Save Editor.app/Contents/MacOS/nwn-save-editor' --help"

      - name: Smoke test the frozen app (Windows)
        if: runner.os == 'Windows'
        run: dist\nwn-save-editor\nwn-save-editor.exe --help

      - name: Smoke test the frozen app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/nwn-save-editor/nwn-save-editor --help

      - uses: actions/upload-artifact@v4
        with:
          name: nwn-save-editor-${{ runner.os }}-${{ runner.arch }}
          # Only the packaged forms, never the unpacked tree.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true       # a human checks the artifacts before it goes public
          generate_release_notes: true
  pages:
    name: Publish preview builds
    needs: build
    # Don't publish builds from PRs. Publish main and manual builds.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare download directory
        run: |
          mkdir -p site

          find artifacts -type f -exec cp {} site/ \;

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>NWN Save Editor - Preview Builds</title>
          </head>
          <body>
            <h1>NWN Save Editor - Preview Builds</h1>
            <ul>
              <li><a href="./nwn-save-editor-Linux-X64.tar.gz">Linux (x86_64)</a></li>
              <li><a href="./nwn-save-editor-Windows-X64.zip">Windows (x64)</a></li>
              <li><a href="./nwn-save-editor-macOS-ARM64.zip">macOS (arm64)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
